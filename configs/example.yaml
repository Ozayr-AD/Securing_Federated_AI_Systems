# Full framework under the boosted backdoor (Code 4.1 of the thesis): SPDZ2k
# aggregation with in-MPC clipping and screening, and the secret MTD schedule.
# Identical to the E1 run e1__smpc_defence_mtd__backdoor__s101 except for the
# run name and output directory. Needs FL_MTD_SECRET and --local-mp-spdz.
attacks:
  attack_type: backdoor
  backdoor:
    poison_fraction: 0.5
    target_label: 0
    trigger_size: 4
  boost: 4.0
  enabled: true
  num_malicious: 3
  placement: stratified
evaluation:
  instrumentation: true
  measure_backdoor_asr: true
  output_dir: results/example
  save_csv: true
  save_plots: false
experiment:
  name: example
  rounds: 10
  seed: 101
federated_learning:
  batch_size: 32
  dataset: fashion_mnist
  fraction_train: 0.34
  framework: flower
  learning_rate: 0.05
  local_epochs: 1
  model: compact_cnn
  num_clients: 12
  partitioning: iid
mtd:
  schedule: secret
smpc:
  backend: mp_spdz_spdz2k
  defence:
    clip_bits: 8
    enabled: true
    fractional_bits: 14
    max_norm: 16.0
    max_valid_norm: 64.0
    median_multiplier_squared: 1
    min_norm: 0.25
    mode: clip_screen
    reveal_client_flags: true
    screen_multiplier_squared: 4
    static_norm: 4.0
    threshold: adaptive
  enabled: true
  fixed_point_scale: 1000000
  min_clients_per_round: 2
  num_aggregation_parties: 3
