name: tests

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[simulation,dev]"
      - name: Compile source and experiment runners
        run: python -m compileall -q src run_*.py analyze_suite.py
      - name: Run test suite
        run: pytest -q
